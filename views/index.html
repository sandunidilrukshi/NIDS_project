
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2 class="logo">NIDS</h2>

        <div class="menu-item active">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-shield-exclamation"></i>
            <span>Threats</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-graph-up"></i>
            <span>Analytics</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-file-earmark"></i>
            <span>Reports</span>
        </div>
    </div>

    <!-- Main -->
    <div class="main-panel">

        <!-- Header -->
        <div class="topbar">
            <h1>NIDS Security Dashboard</h1>

            <div class="top-controls">
                <input 
                    type="text" 
                    id="search" 
                    placeholder="Search logs..."
                    class="search-box"
                >

                <button class="btn btn-primary" onclick="searchLogs()">
                    <i class="bi bi-search"></i>
                </button>

                <a href="/logs/export" class="btn btn-success">
                    Export
                </a>

                <button class="btn btn-dark" onclick="toggleDarkMode()">
                    Dark
                </button>
            </div>
        </div>

        <!-- Top Stats -->
        <div class="stats-row">

            <div class="stat-card red">
                <h5>Total Threats</h5>
                <h2 id="totalThreats">0</h2>
            </div>

            <div class="stat-card yellow">
                <h5>High Risk</h5>
                <h2 id="highRisk">0</h2>
            </div>

            <div class="stat-card blue">
                <h5>Port Scans</h5>
                <h2 id="portScans">0</h2>
            </div>

            <div class="stat-card green">
                <h5>System</h5>
                <h2>Secure</h2>
            </div>

        </div>

        <!-- Main Grid -->
        <div class="content-grid">

            <!-- Chart -->
            <div class="panel chart-panel">
                <div class="panel-header">
                    <h4>Attack Analytics</h4>
                </div>

                <canvas id="attackChart"></canvas>
            </div>

            <!-- Live Alerts -->
            <div class="panel alerts-panel">
                <div class="panel-header">
                    <h4>Live Alerts</h4>
                </div>

                <div id="alerts" class="alerts-container"></div>
            </div>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/script.js"></script>

</body>
</html>
